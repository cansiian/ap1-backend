<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbuns do Radiohead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#08112b; --deep:#0e1b42; --raised:#16295c; --line:#24397a;
  --sky:#5b9dff; --sky-2:#8bbbff; --ice:#e3edff; --mist:#8fa5d4; --danger:#ff6b7f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;font:400 1rem/1.5 var(--body);color:var(--ice);
  background:radial-gradient(900px 480px at 12% -10%,#1b3a8a55,transparent 70%),var(--abyss);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky-2);outline-offset:2px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto;padding-block:3rem 4rem}

header{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;align-items:flex-end;margin-bottom:2rem}
h1{font:800 clamp(2.2rem,5.5vw,3.6rem)/1 var(--display);letter-spacing:-.03em}
.sub{color:var(--mist);margin-top:.6rem;max-width:46ch}
.stats{display:flex;gap:2rem}
.stat b{display:block;font:800 2rem/1 var(--display);color:var(--sky-2)}
.stat span{color:var(--mist);font-size:.9rem}

.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.75rem}
.field-search{flex:1 1 240px}
input,select{
  width:100%;background:var(--deep);border:1px solid var(--line);border-radius:10px;
  padding:.7rem .9rem;transition:border-color .15s,background .15s;
}
input::placeholder{color:#6479ad}
input:hover,select:hover{border-color:#34509f}
input:focus,select:focus{border-color:var(--sky);outline:none;background:#101f4d}
select{width:auto;cursor:pointer}

.btn{
  border:1px solid transparent;border-radius:10px;padding:.7rem 1.15rem;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s,border-color .15s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:wait}
.btn-primary{background:var(--sky);color:#06132e}
.btn-primary:hover{background:var(--sky-2)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ice)}
.btn-ghost:hover{background:var(--raised)}
.btn-danger{background:var(--danger);color:#2a0710}
.btn-danger:hover{background:#ff8a99}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1.5rem}
.card{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:1rem 1rem 1.1rem}
.sleeve{position:relative;width:78%;aspect-ratio:1;margin-bottom:1.1rem}
.cover{
  position:absolute;inset:0;z-index:1;border-radius:10px;padding:.75rem;display:flex;align-items:flex-end;
  background:linear-gradient(150deg,hsl(var(--h) 72% 42%),hsl(calc(var(--h) + 28) 70% 16%));
  box-shadow:0 10px 24px #02081c99;overflow:hidden;
}
.cover::before{
  content:"";position:absolute;width:140%;aspect-ratio:1;right:-60%;top:-50%;border-radius:50%;
  background:repeating-radial-gradient(circle,#ffffff14 0 2px,transparent 2px 14px);
}
.cover b{position:relative;font:800 2.1rem/1 var(--display);letter-spacing:-.02em;color:#ffffffd9}
.disc{
  position:absolute;top:4%;left:4%;height:92%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,hsl(var(--h) 72% 55%) 0 15%,#050b1d 16% 19%,transparent 20%),
             repeating-radial-gradient(circle,#0a1330 0 2px,#16275a 2px 4px);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.card:hover .disc,.card:focus-within .disc{transform:translateX(30%) rotate(40deg)}
.card h2{font:600 1.2rem/1.2 var(--display);margin-bottom:.25rem;overflow-wrap:anywhere}
.meta{color:var(--mist);font-size:.92rem}
.actions{display:flex;gap:.5rem;margin-top:1rem}
.actions .btn{flex:1;padding:.5rem .6rem;font-size:.9rem}

.skeleton{height:330px;border-radius:16px;background:linear-gradient(100deg,var(--deep) 30%,var(--raised) 50%,var(--deep) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.state{grid-column:1/-1;text-align:center;padding:3.5rem 1rem;border:1px dashed var(--line);border-radius:16px;color:var(--mist)}
.state h3{font:600 1.3rem var(--display);color:var(--ice);margin-bottom:.4rem}
.state .btn{margin-top:1.1rem}

dialog{
  margin:auto;width:min(440px,calc(100% - 2rem));padding:1.6rem;border:1px solid var(--line);border-radius:18px;
  background:var(--deep);color:var(--ice);box-shadow:0 30px 80px #000a;
}
dialog::backdrop{background:#030a1fcc;backdrop-filter:blur(4px)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
dialog h2{font:800 1.5rem var(--display);margin-bottom:1.1rem}
dialog p{color:var(--mist)}
label{display:block;font-weight:500;font-size:.92rem;margin:.9rem 0 .35rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.dlg-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.5rem}

#toast{
  position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--raised);border:1px solid var(--sky);padding:.7rem 1.2rem;border-radius:12px;font-weight:500;
  transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--danger)}

.log{margin-top:2.5rem;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem}
.log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.log-head h2{font:600 1.1rem var(--display)}
.log ul{list-style:none;padding:0;margin:0;display:grid;gap:.45rem;max-height:230px;overflow:auto}
.log li{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .75rem;font:.88rem ui-monospace,Consolas,monospace}
.log li b{min-width:3.4rem}
.log .url{color:var(--mist);overflow-wrap:anywhere}
.log .hora{margin-left:auto;color:#6479ad}
.log .vazio{color:var(--mist);font-family:var(--body)}
.cod{min-width:3.2rem;text-align:center;border-radius:8px;padding:.05rem .5rem;font-weight:700}
.cod.ok{background:#123a30;color:#5eeaa8}
.cod.warn{background:#3d2f0f;color:#ffc857}
.cod.bad{background:#46141d;color:var(--danger)}
@media (max-width:560px){.stats{gap:1.4rem}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Álbuns do Radiohead</h1>
      <p class="sub">Sua coleção, guardada no banco de dados. Tudo o que você cadastrar, editar ou excluir aqui fica salvo.</p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="stAlbuns">0</b><span>álbuns</span></div>
      <div class="stat"><b id="stFaixas">0</b><span>faixas</span></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="field-search">
      <input id="busca" type="search" placeholder="Buscar por título ou ano" aria-label="Buscar álbum">
    </div>
    <select id="ordem" aria-label="Ordenar álbuns">
      <option value="ano-asc">Mais antigos primeiro</option>
      <option value="ano-desc">Mais recentes primeiro</option>
      <option value="titulo">Título (A a Z)</option>
    </select>
    <button class="btn btn-primary" id="btnNovo">Novo álbum</button>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>

  <section class="log" aria-label="Respostas da API">
    <div class="log-head">
      <h2>Respostas da API</h2>
      <button class="btn btn-ghost" id="btnLimpar" style="padding:.4rem .8rem;font-size:.85rem">Limpar</button>
    </div>
    <ul id="logLista" aria-live="polite"><li class="vazio">Nenhuma requisição ainda.</li></ul>
  </section>
</div>

<dialog id="dlgForm">
  <form id="form" novalidate>
    <h2 id="formTitulo">Novo álbum</h2>
    <label for="titulo">Título</label>
    <input id="titulo" required maxlength="120" autocomplete="off" placeholder="Ex.: Amnesiac">
    <div class="row">
      <div>
        <label for="ano">Ano de lançamento</label>
        <input id="ano" type="number" required placeholder="2001">
      </div>
      <div>
        <label for="faixas">Número de faixas</label>
        <input id="faixas" type="number" required min="1" max="99" placeholder="11">
      </div>
    </div>
    <p id="formErro" role="alert" style="color:var(--danger);margin-top:.9rem;font-size:.92rem"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" data-fechar>Cancelar</button>
      <button type="submit" class="btn btn-primary" id="btnSalvar">Cadastrar álbum</button>
    </div>
  </form>
</dialog>

<dialog id="dlgExcluir">
  <h2>Excluir álbum?</h2>
  <p id="excluirTexto"></p>
  <div class="dlg-actions">
    <button type="button" class="btn btn-ghost" data-fechar>Cancelar</button>
    <button type="button" class="btn btn-danger" id="btnExcluir">Excluir álbum</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
const API = "/api/albuns";           // caminho relativo: mesma origem da API
const $ = (id) => document.getElementById(id);
let albuns = [], editandoId = null, excluindoId = null;
const anoMax = new Date().getFullYear() + 1;
$("ano").min = 1900; $("ano").max = anoMax;

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const matiz = (t) => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return 200 + (h % 70); };

const TEXTOS = { 200: "OK", 201: "Created", 204: "No Content", 400: "Bad Request", 403: "Forbidden", 404: "Not Found", 500: "Internal Server Error" };
let ultimoStatus = 0;

function registrar(metodo, url, status) {
  ultimoStatus = status;
  const ul = $("logLista");
  ul.querySelector(".vazio")?.remove();
  const classe = status >= 200 && status < 300 ? "ok" : status >= 400 && status < 500 ? "warn" : "bad";
  const li = document.createElement("li");
  li.innerHTML = `<b>${metodo}</b><span class="cod ${classe}">${status || "ERR"}</span>
    <span>${status ? (TEXTOS[status] || "") : "Sem resposta"}</span><span class="url">${esc(url)}</span>
    <span class="hora">${new Date().toLocaleTimeString("pt-BR")}</span>`;
  ul.prepend(li);
  while (ul.children.length > 30) ul.lastChild.remove();
}

const msgErro = (err) => err.status ? `${err.status}: ${err.message}` : err.message;

async function chamar(url, opts = {}) {
  const metodo = opts.method || "GET";
  let r;
  try {
    r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  } catch {
    registrar(metodo, url, 0);
    throw new Error("Sem resposta da API. Confira se ela está rodando.");
  }
  registrar(metodo, url, r.status);
  if (r.status === 204) return null;
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(dados.mensagem || `Erro ${r.status} ao falar com a API.`);
    e.status = r.status;
    throw e;
  }
  return dados;
}

let toastTimer;
function aviso(msg, erro = false) {
  const t = $("toast");
  t.textContent = msg; t.className = "show" + (erro ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", 2800);
}

async function carregar() {
  $("grid").innerHTML = '<div class="skeleton"></div>'.repeat(3);
  try {
    albuns = await chamar(API);
    desenhar();
  } catch {
    $("grid").innerHTML = `<div class="state"><h3>Não foi possível conectar à API</h3>
      <p>Confirme que ela está rodando (dotnet run) e tente de novo.</p>
      <button class="btn btn-primary" id="btnRetry">Tentar de novo</button></div>`;
    $("btnRetry").onclick = carregar;
  }
}

function desenhar() {
  $("stAlbuns").textContent = albuns.length;
  $("stFaixas").textContent = albuns.reduce((s, a) => s + a.numeroFaixas, 0);

  const q = $("busca").value.trim().toLowerCase();
  const o = $("ordem").value;
  const lista = albuns
    .filter(a => a.titulo.toLowerCase().includes(q) || String(a.anoLancamento).includes(q))
    .sort((a, b) => o === "titulo" ? a.titulo.localeCompare(b.titulo, "pt-BR")
      : o === "ano-desc" ? b.anoLancamento - a.anoLancamento : a.anoLancamento - b.anoLancamento);

  if (!lista.length) {
    $("grid").innerHTML = albuns.length
      ? `<div class="state"><h3>Nenhum álbum encontrado</h3><p>Tente outro título ou ano.</p></div>`
      : `<div class="state"><h3>Nenhum álbum cadastrado</h3><p>Cadastre o primeiro para começar a coleção.</p>
         <button class="btn btn-primary" id="btnVazio">Novo álbum</button></div>`;
    if ($("btnVazio")) $("btnVazio").onclick = () => abrirForm();
    return;
  }

  $("grid").innerHTML = lista.map(a => `
    <article class="card" style="--h:${matiz(a.titulo)}">
      <div class="sleeve"><div class="disc"></div><div class="cover"><b>${a.anoLancamento}</b></div></div>
      <h2>${esc(a.titulo)}</h2>
      <p class="meta">${a.numeroFaixas} ${a.numeroFaixas === 1 ? "faixa" : "faixas"}</p>
      <div class="actions">
        <button class="btn btn-ghost" data-acao="editar" data-id="${a.id}">Editar</button>
        <button class="btn btn-ghost" data-acao="excluir" data-id="${a.id}">Excluir</button>
      </div>
    </article>`).join("");
}

function abrirForm(album = null) {
  editandoId = album ? album.id : null;
  $("formTitulo").textContent = album ? "Editar álbum" : "Novo álbum";
  $("btnSalvar").textContent = album ? "Salvar alterações" : "Cadastrar álbum";
  $("titulo").value = album ? album.titulo : "";
  $("ano").value = album ? album.anoLancamento : "";
  $("faixas").value = album ? album.numeroFaixas : "";
  $("formErro").textContent = "";
  $("dlgForm").showModal();
  $("titulo").focus();
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const titulo = $("titulo").value.trim();
  const ano = Number($("ano").value), faixas = Number($("faixas").value);
  const erro = !titulo ? "Informe o título do álbum."
    : !Number.isInteger(ano) || ano < 1900 || ano > anoMax ? `O ano deve estar entre 1900 e ${anoMax}.`
    : !Number.isInteger(faixas) || faixas < 1 || faixas > 99 ? "O número de faixas deve estar entre 1 e 99." : "";
  if (erro) { $("formErro").textContent = erro; return; }

  const corpo = JSON.stringify({ titulo, anoLancamento: ano, numeroFaixas: faixas });
  $("btnSalvar").disabled = true;
  try {
    if (editandoId) { await chamar(`${API}/${editandoId}`, { method: "PUT", body: corpo }); aviso(`Álbum atualizado (${ultimoStatus})`); }
    else { await chamar(API, { method: "POST", body: corpo }); aviso(`Álbum cadastrado (${ultimoStatus})`); }
    $("dlgForm").close();
    await recarregarLista();
  } catch (err) {
    $("formErro").textContent = msgErro(err);
    if (err.status === 404) { aviso(msgErro(err), true); $("dlgForm").close(); await recarregarLista(); }
  } finally { $("btnSalvar").disabled = false; }
});

async function recarregarLista() {
  try { albuns = await chamar(API); desenhar(); } catch (err) { aviso(msgErro(err), true); }
}

$("grid").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-acao]"); if (!b) return;
  const album = albuns.find(a => a.id === Number(b.dataset.id)); if (!album) return;
  if (b.dataset.acao === "editar") {
    try { abrirForm(await chamar(`${API}/${album.id}`)); }
    catch (err) { aviso(msgErro(err), true); await recarregarLista(); }
  } else {
    excluindoId = album.id;
    $("excluirTexto").textContent = `“${album.titulo}” será removido do banco de dados. Essa ação não pode ser desfeita.`;
    $("dlgExcluir").showModal();
  }
});

$("btnExcluir").onclick = async () => {
  $("btnExcluir").disabled = true;
  try {
    await chamar(`${API}/${excluindoId}`, { method: "DELETE" });
    aviso(`Álbum excluído (${ultimoStatus})`);
  } catch (err) { aviso(msgErro(err), true); }
  $("btnExcluir").disabled = false;
  $("dlgExcluir").close();
  await recarregarLista();
};

document.querySelectorAll("[data-fechar]").forEach(b => b.onclick = () => b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", (e) => { if (e.target === d) d.close(); }));
$("btnNovo").onclick = () => abrirForm();
$("btnLimpar").onclick = () => { $("logLista").innerHTML = '<li class="vazio">Nenhuma requisição ainda.</li>'; };
$("busca").oninput = desenhar;
$("ordem").onchange = desenhar;

carregar();
</script>
</body>
</html>
